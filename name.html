<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생일 축하해!</title>
    <style>
        /* 기본 레이아웃 및 배경 색상 전환 애니메이션 설정 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #0b132b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            transition: background-color 1s ease; /* 배경색이 부드럽게 바뀌도록 설정 */
            cursor: pointer; /* 클릭 가능한 영역임을 암시 */
        }

        /* 색종이(confetti)가 떨어질 캔버스 영역 */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 중앙 콘텐츠 영역 */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* 화면 중앙 케이크 이모지 통통 튀는 애니메이션 */
        .cake {
            font-size: 80px;
            animation: bounce 1.2s infinite ease-in-out alternate;
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-20px);
            }
        }

        /* 이름 입력창 스타일 */
        .name-input {
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            outline: none;
            text-align: center;
            width: 220px;
            transition: all 0.3s ease;
        }

        .name-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .name-input:focus {
            border-color: #74b9ff;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(116, 185, 255, 0.5);
        }

        /* ‘생일 축하해!’ 텍스트 무지개색 애니메이션 및 기본 스타일 */
        .birthday-text {
            font-size: 38px;
            font-weight: bold;
            margin: 0;
            background: linear-gradient(to right, #ff7675, #fab1a0, #ffeaa7, #55efc4, #74b9ff, #a29bfe, #fd79a8);
            background-size: 400% auto;
            color: transparent;
            -webkit-background-clip: text;
            animation: rainbow 5s linear infinite;
        }

        @keyframes rainbow {
            0% {
                background-position: 0% center;
            }
            100% {
                background-position: 400% center;
            }
        }

        /* 추가 보조 텍스트 (흰색) */
        .sub-text {
            font-size: 16px;
            color: #ffffff;
            opacity: 0.85;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- 색종이 애니메이션용 캔버스 -->
    <canvas id="confetti-canvas"></canvas>

    <!-- 중앙 콘텐츠 -->
    <div class="content">
        <div class="cake">🎂</div>
        
        <!-- 친구 이름 입력창 -->
        <input type="text" id="nameInput" class="name-input" placeholder="이름을 입력 후 Enter" autocomplete="off">

        <h1 id="birthdayText" class="birthday-text">생일 축하해! 🎉</h1>
        <p class="sub-text">화면을 클릭하면 배경색이 바뀝니다!</p>
    </div>

    <script>
        // 1. 배경색 무작위 변경 기능 (화면 클릭 시 실행)
        const body = document.body;
        
        // 예쁜 어두운 색상 팔레트 목록
        const bgColors = [
            '#0b132b', '#1c1427', '#1a0d25', '#0f172a', 
            '#2d1b36', '#12232e', '#1e1e2f', '#221e22'
        ];

        body.addEventListener('click', (e) => {
            // 입력창을 클릭한 경우는 배경색 변경 이벤트가 중복 발생하지 않도록 예외 처리
            if (e.target.id === 'nameInput') return;

            // 현재 색상이 아닌 다른 무작위 색상 선택
            let randomColor;
            do {
                randomColor = bgColors[Math.floor(Math.random() * bgColors.length)];
            } while (body.style.backgroundColor === randomColor);

            body.style.backgroundColor = randomColor;
        });

        // 2. 이름 입력 및 Enter 키 이벤트 처리
        const nameInput = document.getElementById('nameInput');
        const birthdayText = document.getElementById('birthdayText');

        nameInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                const name = nameInput.value.trim();
                if (name !== '') {
                    birthdayText.textContent = `${name}아, 생일 축하해! 🎉`;
                } else {
                    birthdayText.textContent = `생일 축하해! 🎉`;
                }
            }
        });

        // 3. 순수 자바스크립트로 구현한 컨페티(색종이) 효과
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const confettiCount = 150;
        const confetti = [];
        const colors = ['#ff7675', '#fab1a0', '#ffeaa7', '#55efc4', '#74b9ff', '#a29bfe', '#fd79a8', '#ffffff'];

        for (let i = 0; i < confettiCount; i++) {
            confetti.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                r: Math.random() * 6 + 4,
                d: Math.random() * confettiCount,
                color: colors[Math.floor(Math.random() * colors.length)],
                tilt: Math.random() * 10 - 10,
                tiltAngleIncremental: Math.random() * 0.07 + 0.05,
                tiltAngle: 0
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            confetti.forEach((conf) => {
                ctx.beginPath();
                ctx.lineWidth = conf.r;
                ctx.strokeStyle = conf.color;
                ctx.moveTo(conf.x + conf.tilt + conf.r / 2, conf.y);
                ctx.lineTo(conf.x + conf.tilt, conf.y + conf.tilt + conf.r / 2);
                ctx.stroke();
            });

            update();
        }

        let angle = 0;

        function update() {
            angle += 0.01;

            confetti.forEach((conf, index) => {
                conf.y += (Math.cos(angle + conf.d) + 3 + conf.r / 2) / 2;
                conf.x += Math.sin(angle);
                conf.tilt = Math.sin(conf.tiltAngle) * 15;
                conf.tiltAngle += conf.tiltAngleIncremental;

                if (conf.y > canvas.height) {
                    conf.x = Math.random() * canvas.width;
                    conf.y = -20;
                    conf.tilt = Math.random() * 10 - 10;
                }
            });
        }

        function loop() {
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
