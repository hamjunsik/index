<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 프로필 카드</title>
    <style>
        /* 기본 여백 초기화 및 박스 모델 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 1. 화면 정중앙 배치 및 4. 보라색 그라데이션 배경 */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
            padding: 20px;
            color: #333333;
        }

        /* 1. 흰색 둥근 카드 디자인 */
        .profile-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 28px;
            padding: 44px 32px 36px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(45, 25, 80, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* 카드 전체에 살짝 떠오르는 입체감 부여 */
        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 55px rgba(45, 25, 80, 0.32);
        }

        /* 3. 카드 상단 큰 원형 이미지 플레이스홀더 (회색 동그라미) */
        .avatar-placeholder {
            width: 128px;
            height: 128px;
            background-color: #e2e8f0;
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 500;
            border: 4px solid #f8fafc;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06);
            user-select: none;
        }

        /* 2. 이름 스타일 및 5. 마우스 호버 시 색상 변경 효과 */
        .profile-name {
            font-size: 1.75rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 10px;
            display: inline-block;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.2s ease;
        }

        .profile-name:hover {
            color: #764ba2;
            transform: scale(1.03);
        }

        /* 2. 한줄 소개 스타일 */
        .profile-bio {
            font-size: 0.98rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 28px;
            word-break: keep-all;
        }

        /* 구분선 */
        .divider {
            height: 1px;
            background-color: #f1f5f9;
            margin-bottom: 24px;
        }

        /* 좋아하는 것 섹션 제목 */
        .favorites-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            margin-bottom: 14px;
        }

        /* 2. 좋아하는 것 3가지 리스트 */
        .favorites-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .favorite-item {
            background-color: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 14px;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .favorite-item:hover {
            background-color: #f3e8ff;
            border-color: #e9d5ff;
        }

        .emoji {
            font-size: 1.2rem;
            line-height: 1;
        }

        /* SNS 링크 버튼 영역 */
        .sns-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
            padding-top: 22px;
            border-top: 1px solid #f1f5f9;
        }

        /* SNS 링크 버튼 기본 스타일 (알약형) */
        .sns-button {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 12px;
            border-radius: 9999px;
            background-color: #f3e8ff;
            color: #6b21a8;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid #e9d5ff;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
        }

        .sns-button svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        /* SNS 버튼 마우스 호버 시 배경색 변경 및 떠오르는 효과 */
        .sns-button:hover {
            background-color: #764ba2;
            color: #ffffff;
            border-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(118, 75, 162, 0.28);
        }

        /* 모바일 화면 대응 */
        @media (max-width: 420px) {
            .profile-card {
                padding: 36px 24px 30px;
                border-radius: 24px;
            }

            .avatar-placeholder {
                width: 110px;
                height: 110px;
            }

            .profile-name {
                font-size: 1.55rem;
            }
        }
    </style>
</head>
<body>

    <!-- 프로필 카드 컨테이너 -->
    <main class="profile-card">
        <!-- 상단 원형 이미지 플레이스홀더 -->
        <div class="avatar-placeholder" aria-label="프로필 사진 자리">
            프로필 사진
        </div>

        <!-- 이름 (호버 시 색상 변경) -->
        <h1 class="profile-name">김민수</h1>

        <!-- 한줄 소개 -->
        <p class="profile-bio">
            작은 디테일로 사용자에게 즐거움을 주는<br>
            웹 프론트엔드 개발자입니다.
        </p>

        <div class="divider"></div>

        <!-- 좋아하는 것 3가지 -->
        <section aria-label="좋아하는 것들">
            <h2 class="favorites-title">좋아하는 것 3가지</h2>
            <ul class="favorites-list">
                <li class="favorite-item">
                    <span class="emoji" role="img" aria-label="커피">☕</span>
                    <span>아침에 마시는 따뜻한 핸드드립 커피</span>
                </li>
                <li class="favorite-item">
                    <span class="emoji" role="img" aria-label="산책">🌿</span>
                    <span>해 질 녘 공원 따라 음악 들으며 산책하기</span>
                </li>
                <li class="favorite-item">
                    <span class="emoji" role="img" aria-label="코딩">💻</span>
                    <span>깔끔한 코드로 아이디어를 현실로 만들기</span>
                </li>
            </ul>
        </section>

        <!-- SNS 링크 버튼 3개 -->
        <nav class="sns-links" aria-label="SNS 링크">
            <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="sns-button">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                <span>GitHub</span>
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="sns-button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
                <span>Instagram</span>
            </a>
            <a href="https://velog.io" target="_blank" rel="noopener noreferrer" class="sns-button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
                <span>Blog</span>
            </a>
        </nav>
    </main>

</body>
</html>
